name: iBridge MVP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require complete MVP source
        run: |
          test -f macos/Package.swift
          test -f gateway/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/export_operations.py --check
      - run: python -m unittest discover -s tests -p 'test_macos_installation.py' -v
      - run: bash -n scripts/build_macos_app.sh scripts/install_macos.sh scripts/status_macos.sh scripts/ibridge.sh

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-compatibility.txt
      - run: npm ci
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - name: Test Hermes against the built gateway
        env:
          IBRIDGE_REQUIRE_GATEWAY_TESTS: '1'
        run: python3 -m unittest discover -s tests -v

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Test installer path and preservation behavior
        run: python3 -m unittest discover -s tests -p 'test_macos_installation.py' -v
      - name: Confirm hardware architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Test native code without Apple account access
        run: swift test --package-path macos
      - name: Build and verify signed application
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: scripts/build_macos_app.sh --arch "$BUILD_ARCH" --output build/package
      - name: Hide the SwiftPM build tree to verify standalone resources
        run: mv macos/.build "$RUNNER_TEMP/ibridge-native-build"
      - name: Verify packaged Notes script and Automation permission declarations
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          app = pathlib.Path('build/package/iBridge.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert info['NSAppleEventsUsageDescription']
          signed = subprocess.run(['/usr/bin/codesign', '-d', '--entitlements', ':-', str(app)],
                                  check=True, capture_output=True)
          assert plistlib.loads(signed.stdout)['com.apple.security.automation.apple-events'] is True
          script = app / 'Contents/Resources/iBridge_IBridgeCore.bundle/Notes.applescript'
          subprocess.run(['/usr/bin/osacompile', '-o', os.path.join(os.environ['RUNNER_TEMP'], 'ibridge-notes.scpt'),
                          str(script)], check=True, timeout=30)
          PY
      - name: Inspect bundled host without prompts
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix='ibridge-ci-') as state:
              env = dict(os.environ, IBRIDGE_HOME=state)
              subprocess.run(['build/package/iBridge.app/Contents/MacOS/iBridgeHost', '--check'],
                             check=True, timeout=30, env=env)
          PY
      - name: Smoke-test real installation without starting login agents
        run: |
          scripts/install_macos.sh --no-start \
            --app-source "$PWD/build/package/iBridge.app" \
            --home "$RUNNER_TEMP/iBridge State" \
            --app-destination "$RUNNER_TEMP/Applications With Spaces/iBridge.app" \
            --launch-agents-dir "$RUNNER_TEMP/iBridge LaunchAgents"
          scripts/ibridge.sh --home "$RUNNER_TEMP/iBridge State" client list
          python3 - <<'PY_CHECK'
          import os, pathlib, subprocess
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          env = dict(os.environ, IBRIDGE_HOME=str(temporary / 'iBridge State'))
          executable = temporary / 'Applications With Spaces/iBridge.app/Contents/MacOS/iBridgeHost'
          subprocess.run([str(executable), '--check'], check=True, timeout=30, env=env)
          PY_CHECK
      - name: Preserve application permissions in download
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent build/package/iBridge.app "build/iBridge-macos-$BUILD_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: iBridge-macos-${{ matrix.arch }}
          path: build/iBridge-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Restore SwiftPM build tree
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/ibridge-native-build" ]]; then
            mv "$RUNNER_TEMP/ibridge-native-build" macos/.build
          fi
