name: ibridge
version: 0.3.0
description: Access your personal macOS iBridge through a private authenticated API.
provides_tools:
  - ibridge_capabilities
  - ibridge_calendar_list
  - ibridge_calendar_list_events
  - ibridge_reminders_lists
  - ibridge_reminders_list
  - ibridge_contacts_search
  - ibridge_drive_roots
  - ibridge_drive_list
  - ibridge_drive_search
  - ibridge_drive_read
  - ibridge_notes_folders
  - ibridge_notes_search
  - ibridge_notes_read
  - ibridge_messages_chats
  - ibridge_messages_search
  - ibridge_messages_read
  - ibridge_calendar_create_event
  - ibridge_reminders_create
  - ibridge_reminders_complete
  - ibridge_notes_create
  - ibridge_drive_upload
requires_env:
  - name: IBRIDGE_URL
    description: HTTPS origin of your Mac's bridge, such as https://mac.example.ts.net
    secret: false
  - name: IBRIDGE_TOKEN
    description: Client token issued by your iBridge server
    secret: true
